<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <title>TAKAI TAKAI GAME⬆️</title>
    <link rel="stylesheet" href="./css/minigame.css" />
  </head>
  <body>
    <div id="game-wrapper">
      <h1>TAKAI TAKAI GAME</h1>
      <p class="score-board">Score: <span id="score">0</span></p>
      <div class="wrapper">
        <div class="canvas-container">
          <canvas id="gameCanvas"></canvas>
          <div id="ui-overlay" class="overlay">
            <div id="start-screen">
              <button id="start-btn" class="btn">Start!</button>
              <p class="instructions">
                드래그나 터치로 게게로를 움직이세요.
                <br />
                ドラッグまたはタッチで<br />ゲゲ郎を動かしてください。
              </p>
            </div>
            <div id="game-over-screen" class="hidden">
              <img
                src="./asset/gameover.png"
                width="200"
                height="200"
                alt="mizuki"
                class="gameover"
              />
              <h2>Total Score</h2>
              <p id="final-score" class="final-score-text">0</p>
              <button id="restart-btn" class="btn restart">Play Again</button>
            </div>
          </div>
        </div>
        <span class="account">
          made by <a href="https://x.com/cokacoku" class="link">@cokacoku</a>
        </span>
      </div>
    </div>

    <script src="./js/minigame_v1.js"></script>
  </body>
</html>
