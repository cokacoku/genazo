<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Ball Game</title>
    <link rel="stylesheet" href="./css/minigame.css" />
  </head>
  <body>
    <div id="game-wrapper">
      <h1>Bouncing Ball</h1>
      <p class="score-board">Score: <span id="score">0</span></p>

      <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay" class="overlay">
          <div id="start-screen">
            <h2>Ready to Play?</h2>
            <button id="start-btn" class="btn">Start Game</button>
          </div>
          <div id="game-over-screen" class="hidden">
            <h2>Total Score</h2>
            <p id="final-score" class="final-score-text">0</p>
            <button id="restart-btn" class="btn">Play Again</button>
          </div>
        </div>
      </div>

      <p class="instructions">Drag or Touch to move the paddle.</p>
    </div>

    <script src="./js/minigame.js"></script>
  </body>
</html>
