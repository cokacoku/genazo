<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>미즈키씨의 핫케이크 타워 🥞</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gaegu:wght@700&family=Pretendard:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 분리된 스타일시트 연결 -->
    <link rel="stylesheet" href="./css/hotcake.css" />
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="gameCanvas"></canvas>

      <!-- 상단 HUD -->
      <div
        id="hud-bar"
        class="absolute top-3 left-3 right-3 flex items-center justify-between pointer-events-none z-10"
      >
        <div class="toy-badge px-3.5 py-1.5 flex items-center gap-2">
          <span class="text-xl">🥞</span>
          <div>
            <div
              id="hud-current-label"
              class="text-[10px] font-bold text-[#8B4513] leading-none"
            >
              현재 높이
            </div>
            <div
              class="font-display text-lg font-bold text-[#3E2314] leading-tight"
            >
              <span id="hud-count">0</span
              ><span id="hud-count-unit" class="text-xs ml-0.5">장</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 pointer-events-auto">
          <div class="toy-badge px-3.5 py-1.5 text-right">
            <div
              id="hud-best-label"
              class="text-[10px] font-bold text-[#8B4513] leading-none"
            >
              최고 기록
            </div>
            <div
              class="font-display text-lg font-bold text-[#D9381E] leading-tight"
            >
              <span id="hud-best">0</span
              ><span id="hud-best-unit" class="text-xs ml-0.5">장</span>
            </div>
          </div>

          <button
            id="sound-btn"
            type="button"
            class="toy-badge w-10 h-10 flex items-center justify-center text-lg active:scale-95 transition"
            title="소리 켜기/끄기"
          >
            🔊
          </button>
        </div>
      </div>

      <!-- 시작 화면 오버레이 -->
      <div
        id="start-overlay"
        class="absolute inset-0 z-20 flex flex-col items-center justify-between p-6 bg-black/25 backdrop-blur-[2px] transition-opacity duration-300"
      >
        <div class="mt-14 text-center">
          <div
            id="title-badge"
            class="inline-block px-3.5 py-1 rounded-full bg-[#FFE169] border-2 border-[#3E2314] text-[#3E2314] font-extrabold text-xs mb-2 shadow-sm"
          >
            GENAZO FANMADE GAME
          </div>
          <h1
            id="title-heading"
            class="font-hand text-5xl sm:text-6xl font-bold text-[#FFFDF9] drop-shadow-[0_4px_0_#3E2314] tracking-tight leading-none"
          >
            미즈키씨의<br /><span class="text-[#FFE169]">핫케이크</span> 타워
          </h1>
          <p
            id="title-sub"
            class="mt-3 text-xs sm:text-sm font-bold text-[#FFF8E7] bg-[#3E2314]/80 px-4 py-2 rounded-2xl border border-[#FFF8E7]/20 inline-block"
          >
            프라이팬을 튕겨 핫케이크를 높이 쌓아보세요!<br />완성된 타워
            꼭대기엔 고소한 버터가 올라갑니다!
          </p>
        </div>

        <div class="w-full max-w-xs mb-8 flex flex-col items-center gap-3">
          <div class="w-full toy-card p-3.5 text-xs text-[#3E2314] space-y-1.5">
            <div class="flex items-center gap-2 font-bold">
              <span class="text-base">🍳</span>
              <span id="rule-1"
                ><b>클릭 / 터치 / 스페이스바</b>로 핫케이크 토스!</span
              >
            </div>
            <div class="flex items-center gap-2 font-bold">
              <span class="text-base">✅</span>
              <span id="rule-2">PC, Mobile OK!</span>
            </div>
          </div>

          <button
            id="start-btn"
            type="button"
            class="toy-btn w-full py-3.5 text-xl font-extrabold tracking-wide flex items-center justify-center gap-2"
          >
            <span>🥞 요리 시작하기!</span>
          </button>
        </div>
      </div>

      <!-- 결과 카운팅 & 게임오버 오버레이 -->
      <div
        id="result-overlay"
        class="absolute inset-0 z-20 hidden flex-col justify-between p-5 pointer-events-none"
      >
        <div class="mt-12 flex flex-col items-center pointer-events-auto">
          <div
            id="fail-reason-badge"
            class="px-4 py-1 rounded-full bg-[#D9381E] text-white font-extrabold text-xs border-2 border-[#3E2314] shadow mb-1.5 animate-bounce"
          >
            앗! 핫케이크가 바닥에 떨어졌어요!
          </div>

          <div
            class="toy-card px-6 py-3 text-center w-full max-w-xs relative overflow-hidden"
          >
            <div
              id="counting-title"
              class="text-xs font-extrabold text-[#8B4513]"
            >
              접시 위 핫케이크 높이 세는 중...
            </div>
            <div class="flex items-baseline justify-center gap-1 my-0.5">
              <span
                id="tallied-number"
                class="font-display text-5xl font-extrabold text-[#D9381E] drop-shadow-[0_2px_0_#3E2314]"
                >0</span
              >
              <span
                id="tallied-unit"
                class="font-extrabold text-xl text-[#3E2314]"
                >층</span
              >
            </div>
            <div
              id="result-rank-text"
              class="text-xs font-bold text-[#6B4423] h-4"
            >
              밑에서부터 차곡차곡 세어볼까요?
            </div>
          </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div
          class="mb-5 flex flex-col items-center gap-2.5 w-full max-w-xs mx-auto pointer-events-auto"
        >
          <button
            id="save-img-btn"
            type="button"
            class="toy-btn w-full py-3 text-base font-extrabold flex items-center justify-center gap-1.5 opacity-0 pointer-events-none transition-opacity duration-300"
            style="
              background: linear-gradient(180deg, #98f5e1 0%, #4ecdc4 100%);
            "
          >
            <span>📸 결과 이미지 저장</span>
          </button>

          <button
            id="retry-btn"
            type="button"
            class="toy-btn w-full py-3.5 text-lg font-extrabold flex items-center justify-center gap-2 opacity-0 pointer-events-none transition-opacity duration-300"
          >
            <span>🔄 다시 쌓아보기!</span>
          </button>
        </div>
      </div>

      <!-- 하단 조작 힌트 바 -->
      <div
        id="play-hint"
        class="absolute bottom-3 left-0 right-0 flex justify-center pointer-events-none z-10 opacity-0 transition-opacity"
      >
        <div
          id="play-hint-box"
          class="px-4 py-1.5 rounded-full bg-[#3E2314]/75 text-[#FFF8E7] text-xs font-bold backdrop-blur-sm border border-white/15"
        >
          👆 화면 클릭 또는
          <kbd
            class="px-1.5 py-0.5 bg-[#FFE169] text-[#3E2314] rounded font-extrabold mx-0.5"
            >Space</kbd
          >
          로 던지기!
        </div>
      </div>

      <a
        href="https://lit.link/ko/cokacoku"
        target="_blank"
        rel="noopener noreferrer"
        class="creator-credit"
      >
        @cokacoku
      </a>
    </div>

    <script src="./js/hotcake_v2.js"></script>
    <script
      data-goatcounter="https://cokacoku.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
